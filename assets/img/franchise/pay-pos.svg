<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Payment at the POS terminal: a handheld terminal with the receipt coming out and a card inserted
       at the bottom (drawn for the site, ECOES Franchise page) -->
  <!-- the receipt -->
  <path d="M47 24 V5 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 V24 Z" fill="#dfe7ec"/>
  <rect x="52" y="12" width="20" height="2.4" rx="1.2" fill="#0b3d38" opacity=".5"/>
  <rect x="52" y="17" width="14" height="2.4" rx="1.2" fill="#0b3d38" opacity=".5"/>
  <!-- the card, inserted at the bottom (drawn before the body, so its top is inside the slot) -->
  <rect x="47" y="92" width="34" height="34" rx="4" fill="#74e6b6"/>
  <rect x="53" y="108" width="10" height="8" rx="1.6" fill="#f2f5f7" opacity=".9"/>
  <path d="M53 112 h10 M58 108 v8" stroke="#74e6b6" stroke-width=".9"/>
  <!-- the terminal -->
  <rect x="34" y="20" width="60" height="86" rx="12" fill="#f2f5f7"/>
  <rect x="93" y="42" width="3.6" height="24" rx="1.8" fill="#c9d4db"/>
  <rect x="42" y="29" width="44" height="22" rx="3.5" fill="#0b3d38"/>
  <rect x="48" y="38" width="22" height="3" rx="1.5" fill="#74e6b6"/>
  <rect x="74" y="38" width="6" height="3" rx="1.5" fill="#74e6b6" opacity=".6"/>
  <g fill="#0b3d38">
    <rect x="43" y="57" width="11" height="7" rx="2"/><rect x="58.5" y="57" width="11" height="7" rx="2"/><rect x="74" y="57" width="11" height="7" rx="2"/>
    <rect x="43" y="67" width="11" height="7" rx="2"/><rect x="58.5" y="67" width="11" height="7" rx="2"/><rect x="74" y="67" width="11" height="7" rx="2"/>
    <rect x="43" y="77" width="11" height="7" rx="2"/><rect x="58.5" y="77" width="11" height="7" rx="2"/><rect x="74" y="77" width="11" height="7" rx="2"/>
    <rect x="43" y="87" width="11" height="7" rx="2"/><rect x="58.5" y="87" width="11" height="7" rx="2"/><rect x="74" y="87" width="11" height="7" rx="2" fill="#74e6b6"/>
  </g>
  <!-- the slot the card goes into -->
  <rect x="44" y="101" width="40" height="3" rx="1.5" fill="#0b3d38" opacity=".55"/>
</svg>
