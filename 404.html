<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – ECOES Franchise</title>
  <meta name="robots" content="noindex">
  <style>
    /* GitHub Pages serves this page at any missing address, so it carries its own styles. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      color: #c3ced5; font: 400 17px/1.65 "Segoe UI", Arial, sans-serif;
      background: radial-gradient(60vw 40vw at 80% 0%, rgba(46, 110, 128, .22), transparent 70%), radial-gradient(50vw 40vw at 10% 100%, rgba(63, 184, 255, .1), transparent 70%), #112031; }
    .panel { max-width: 620px; width: 100%; padding: clamp(26px, 6vw, 52px); border-radius: 28px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .015) 46%), rgba(14, 21, 28, .5);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), 0 40px 80px -40px rgba(0, 0, 0, .8); }
    h1 { margin: 0 0 14px; color: #edf2f4; font: 300 clamp(30px, 6vw, 46px)/1.1 "Segoe UI", Arial, sans-serif; letter-spacing: -.02em; }
    p { margin: 0 0 14px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px;
      background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22); color: #edf2f4; font-weight: 600; text-decoration: none; }
    a:first-child { background: #f2f5f7; color: #06090c; box-shadow: none; }
    a:focus-visible { outline: 2px solid #f2f5f7; outline-offset: 3px; }
    [lang="bg"] { font-size: 16px; opacity: .9; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Page not found</h1>
    <p>This page does not exist, or it has moved.</p>
    <p lang="bg">Тази страница не съществува или е преместена.</p>
    <div class="links">
      <a href="/FranchiseEcoes/" data-to="">Home</a>
      <a href="/FranchiseEcoes/bg/" data-to="bg/" lang="bg">Начало</a>
      <a href="/FranchiseEcoes/contact-us/" data-to="contact-us/">Contact us</a>
    </div>
  </main>
  <script>
    // the site lives at /FranchiseEcoes/ on github.io and at / on its own domain
    (function () {
      var base = /^\/FranchiseEcoes\//i.test(location.pathname) ? '/FranchiseEcoes/' : '/';
      Array.prototype.forEach.call(document.querySelectorAll('a[data-to]'), function (a) { a.href = base + a.getAttribute('data-to'); });
    })();
  </script>
</body>
</html>
