<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – ECOES Franchise</title>
  <meta name="robots" content="noindex">
  <style>
    /* GitHub Pages serves this page at any missing address, so it carries its own styles (v3 trial: the light page). */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      color: #2b3a36; font: 400 17px/1.65 "Segoe UI", Arial, sans-serif;
      background: radial-gradient(60vw 40vw at 90% 0%, rgba(166, 244, 210, .45), transparent 70%), radial-gradient(50vw 40vw at 0% 100%, rgba(194, 226, 238, .55), transparent 70%), #f2f6f3; }
    .panel { max-width: 620px; width: 100%; padding: clamp(26px, 6vw, 52px); border-radius: 28px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .6));
      box-shadow: inset 0 0 0 1px rgba(13, 74, 68, .16), 0 30px 60px -40px rgba(6, 41, 37, .45); }
    h1 { margin: 0 0 14px; color: #0b1d19; font: 600 clamp(30px, 6vw, 46px)/1.1 "Segoe UI", Arial, sans-serif; letter-spacing: -.02em; }
    p { margin: 0 0 14px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px;
      background: rgba(255, 255, 255, .7); box-shadow: inset 0 0 0 1px rgba(13, 74, 68, .32); color: #0b1d19; font-weight: 600; text-decoration: none; }
    a:first-child { background: #0d4a44; color: #fff; box-shadow: none; }
    a:focus-visible { outline: 2px solid #0d4a44; outline-offset: 3px; }
    [lang="bg"] { font-size: 16px; opacity: .9; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Page not found</h1>
    <p>This page does not exist, or it has moved.</p>
    <p lang="bg">Тази страница не съществува или е преместена.</p>
    <div class="links">
      <a href="/" data-to="">Home</a>
      <a href="/bg/" data-to="bg/" lang="bg">Начало</a>
      <a href="/contact-us/" data-to="contact-us/">Contact us</a>
    </div>
  </main>
  <script>
    // the site lives at / on franchise.ecoes.eu (since 2026-11-06); /FranchiseEcoes/ on github.io only redirects there
    (function () {
      var base = /^\/FranchiseEcoes\//i.test(location.pathname) ? '/FranchiseEcoes/' : '/';
      Array.prototype.forEach.call(document.querySelectorAll('a[data-to]'), function (a) { a.href = base + a.getAttribute('data-to'); });
    })();
  </script>
</body>
</html>
