<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – ECOES Franchise</title>
  <meta name="robots" content="noindex">
  <style>
    /* GitHub Pages serves this page at any missing address, so it carries its own styles. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: #eef1f3; color: #1d2227; font: 400 18px/1.6 "Segoe UI", Arial, sans-serif; box-sizing: border-box; }
    .panel { max-width: 640px; width: 100%; padding: clamp(24px, 6vw, 56px); border-radius: 10px; color: #fff;
      background: #c8161d; box-shadow: 0 0 0 1px #949fa9, 0 0 0 6px #d3d9de, 0 0 0 7px #9aa5ae, 0 26px 50px -30px rgba(29, 34, 39, .7); }
    h1 { margin: 0 0 12px; font: 700 clamp(34px, 7vw, 56px)/1 "Arial Narrow", Arial, sans-serif; letter-spacing: -.01em; }
    p { margin: 0 0 20px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 6px;
      background: #fff; color: #a51219; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    [lang="bg"] { font-size: 16.5px; opacity: .92; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Page not found</h1>
    <p>This page does not exist, or it has moved.</p>
    <p lang="bg">Тази страница не съществува или е преместена.</p>
    <div class="links">
      <a href="/FranchiseEcoes/" data-to="">Home</a>
      <a href="/FranchiseEcoes/bg/" data-to="bg/" lang="bg">Начало</a>
      <a href="/FranchiseEcoes/contact-us/" data-to="contact-us/">Contact us</a>
    </div>
  </main>
  <script>
    // the site lives at /FranchiseEcoes/ on github.io and at / on its own domain
    (function () {
      var base = /^\/FranchiseEcoes\//i.test(location.pathname) ? '/FranchiseEcoes/' : '/';
      Array.prototype.forEach.call(document.querySelectorAll('a[data-to]'), function (a) { a.href = base + a.getAttribute('data-to'); });
    })();
  </script>
</body>
</html>
